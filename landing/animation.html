<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Background with Hover Effect</title>
  <style>
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }

      body {
          background-color: #0D0D0D;
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          font-family: Arial, sans-serif;
          overflow: hidden;
      }

      .container {
          position: relative;
          width: 1632px;
          height: 872px;
      }

      .background-texture {
          position: absolute;
          width: 100%;
          height: 100%;
          left: 0;
          top: 0;
          /* background: radial-gradient(55.24% 64.04% at 50% 50%, rgba(13, 13, 13, 0) 0%, #0D0D0D 100%); */
          z-index: 442;
          pointer-events: none;
      }

      .grid-container {
          position: absolute;
          width: 1632px;
          height: 872px;
          left: calc(50% - 1632px/2);
          top: calc(50% - 872px/2);
          display: flex;
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
          align-items: center;
          align-content: center;
          padding: 0px;
          row-gap: 0px;
          isolation: isolate;
      }

      .grid-cell {
          box-sizing: border-box;
          width: 97px;
          height: 40px;
          background: #0D0D0D;
          border: none;
          box-shadow: 
              0.5px 0 0 0 #1E1E1E,
              0 0.5px 0 0 #1E1E1E,
              0.5px 0.5px 0 0 #1E1E1E,
              inset 0.5px 0 0 0 #1E1E1E,
              inset 0 0.5px 0 0 #1E1E1E;
          flex: none;
          flex-grow: 0;
          transition: box-shadow 0.15s ease-out;
      }

      /* Two-level pulsing: 30% and 15% brightness */
      .grid-cell.pulsing-30 {
          animation: fadeIn30 1.5s ease-out forwards;
      }

      @keyframes fadeIn30 {
          0% { background: #0D0D0D; }
          100% { background: #1f1f1f; }
      }

      .grid-cell.pulsing-15 {
          animation: fadeIn15 1.5s ease-out forwards;
      }

      @keyframes fadeIn15 {
          0% { background: #0D0D0D; }
          100% { background: #131313; }
      }

      .grid-cell.fading-out-30 {
          animation: fadeOut30 1.5s ease-in forwards;
      }

      @keyframes fadeOut30 {
          0% { background: #1f1f1f; }
          100% { background: #0D0D0D; }
      }

      .grid-cell.fading-out-15 {
          animation: fadeOut15 1.5s ease-in forwards;
      }

      @keyframes fadeOut15 {
          0% { background: #131313; }
          100% { background: #0D0D0D; }
      }

  </style>
</head>
<body>
<div class="container">
  <div class="grid-container" id="gridContainer"></div>
  <div class="background-texture"></div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const gridContainer = document.getElementById('gridContainer');
    const gridCells = [];

    for (let i = 0; i < 443; i++) {
      const gridCell = document.createElement('div');
      gridCell.className = 'grid-cell';
      gridCell.style.order = i;
      gridCell.style.zIndex = i;
      gridContainer.appendChild(gridCell);
      gridCells.push(gridCell);
    }

    (function() {
      const maxActive = 24;
      let pulsing = new Map();
      const gridWidth = 17; // Approximate cells per row (1632px / 97px ≈ 17)

      function getBrightnessClass() {
        // 50/50 chance between 30% and 15% brightness
        return Math.random() < 0.5 ? 'pulsing-30' : 'pulsing-15';
      }

      function getConnectedCells(startIdx, patternType) {
        const patterns = {
          line: (start) => [start, start + 1, start + 2],
          lShape: (start) => [start, start + 1, start + gridWidth, start + gridWidth + 1],
          square: (start) => [start, start + 1, start + gridWidth, start + gridWidth + 1],
          diagonal: (start) => [start, start + gridWidth + 1, start + 2 * gridWidth + 2],
          cross: (start) => [start, start - gridWidth, start + gridWidth, start - 1, start + 1],
          zigzag: (start) => [start, start + 1, start + gridWidth - 1, start + gridWidth]
        };
        
        const pattern = patterns[patternType] || patterns.line;
        return pattern(startIdx).filter(idx => idx >= 0 && idx < gridCells.length && !pulsing.has(idx));
      }

      function addConnectedPattern() {
        // Weighted group size picker favoring larger groups (4 > 3 > 2)
        const capacityLeft = Math.max(0, maxActive - pulsing.size);
        if (capacityLeft < 2) return; // not enough room for a group
        const r = Math.random();
        let desired;
        if (r < 0.15) desired = 2;          // 15%
        else if (r < 0.50) desired = 3;     // 35%
        else desired = 4;                   // 50%
        const groupSize = Math.min(desired, capacityLeft);
        
        const available = gridCells.map((_, i) => i).filter(i => !pulsing.has(i));
        if (available.length === 0) return;
        
        const startIdx = available[Math.floor(Math.random() * available.length)];
        const patternTypes = ['line', 'lShape', 'square', 'diagonal', 'cross', 'zigzag'];
        const patternType = patternTypes[Math.floor(Math.random() * patternTypes.length)];
        
        let connectedCells = getConnectedCells(startIdx, patternType);
        if (connectedCells.length < 2) return;
        // trim to fit the groupSize and capacity
        connectedCells = connectedCells.slice(0, groupSize).filter(idx => !pulsing.has(idx));
        if (connectedCells.length < 2) return;
        
        connectedCells.forEach((idx, i) => {
          // Random delay between 300-800ms for each cell in pattern
          const delay = Math.random() * 500 + 300;
          // Random glow duration between 4-8 seconds (after fade in)
          const glowDuration = Math.random() * 4000 + 4000;
          
          setTimeout(() => {
            // re-check capacity before activating to strictly enforce maxActive
            if (pulsing.size >= maxActive) return;
            if (!pulsing.has(idx)) {
              const cls = getBrightnessClass(); // choose color per cell
              // Start fade in
              gridCells[idx].classList.add(cls);
              pulsing.set(idx, {c: cls, isPattern: true});
              
              // After fade in + glow duration, start fade out
              setTimeout(() => {
              gridCells[idx].classList.remove(cls);
              gridCells[idx].classList.add(`fading-out-${cls.replace('pulsing-', '')}`);
                
                // After fade out completes, clean up
                setTimeout(() => {
                  gridCells[idx].classList.remove(`fading-out-${cls.replace('pulsing-', '')}`);
                  pulsing.delete(idx);
                }, 1500); // 1.5s fade out duration
              }, 1500 + glowDuration); // 1.5s fade in + random glow duration
            }
          }, i * delay);
        });
        
      }

      function add() {
        if (pulsing.size >= maxActive) return;
        const available = gridCells.map((_, i) => i).filter(i => !pulsing.has(i));
        if (available.length === 0) return;
        const idx = available[Math.floor(Math.random() * available.length)];
        const cls = getBrightnessClass();
        
        // Random glow duration between 3-7 seconds (after fade in)
        const glowDuration = Math.random() * 4000 + 3000;
        
        // Start fade in
        gridCells[idx].classList.add(cls);
        pulsing.set(idx, {c: cls, isPattern: false});
        
        // After fade in + glow duration, start fade out
        setTimeout(() => {
          gridCells[idx].classList.remove(cls);
          gridCells[idx].classList.add(`fading-out-${cls.replace('pulsing-', '')}`);
          
          // After fade out completes, clean up
          setTimeout(() => {
            gridCells[idx].classList.remove(`fading-out-${cls.replace('pulsing-', '')}`);
            pulsing.delete(idx);
          }, 1500); // 1.5s fade out duration
        }, 1500 + glowDuration); // 1.5s fade in + random glow duration
      }

      // Continuous spawner: decoupled from completion to avoid waves
      function spawnNext() {
        const delay = Math.random() * 800 + 200; // 0.2s - 1s between spawns
        setTimeout(() => {
          if (pulsing.size < maxActive) {
            if (Math.random() < 0.25) {
              add();
            } else {
              addConnectedPattern();
            }
          }
          spawnNext();
        }, delay);
      }

      // Kick off continuous spawning
      spawnNext();
    })();

    let mouseX = -1000, mouseY = -1000;
    const cellData = gridCells.map(cell => {
      const rect = cell.getBoundingClientRect();
      return {el: cell, x: rect.left + rect.width / 2, y: rect.top + rect.height / 2};
    });

    function interpolate(base, glow, f) {
      const hex2rgb = h => {
        const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h);
        return r ? {r: parseInt(r[1], 16), g: parseInt(r[2], 16), b: parseInt(r[3], 16)} : null;
      };
      const b = hex2rgb(base), g = hex2rgb(glow);
      if (!b || !g) return base;
      const r = Math.round(b.r + (g.r - b.r) * f);
      const gr = Math.round(b.g + (g.g - b.g) * f);
      const bl = Math.round(b.b + (g.b - b.b) * f);
      return `#${((1 << 24) + (r << 16) + (gr << 8) + bl).toString(16).slice(1)}`;
    }

    function update() {
      cellData.forEach(({el, x, y}) => {
        const dist = Math.sqrt((mouseX - x) ** 2 + (mouseY - y) ** 2);
        let base = '#1E1E1E';
        let color = base;
        if (dist < 200) {
          const intensity = (1 - dist / 200) ** 2;
          color = interpolate(base, '#7F7F7F', intensity);
        }
        el.style.boxShadow = `0.5px 0 0 0 ${color},0 0.5px 0 0 ${color},0.5px 0.5px 0 0 ${color},inset 0.5px 0 0 0 ${color},inset 0 0.5px 0 0 ${color}`;
      });
      requestAnimationFrame(update);
    }

    document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
    document.addEventListener('mouseleave', () => { mouseX = -1000; mouseY = -1000; });
    update();
  });
</script>
</body>
</html>
